      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"

  <body>
    <!-- Initial App Shell Loader (prevents blank screen during initial script download) -->
    <div
      id="initial-loader"
      style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #030712;
        color: #22c55e;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        z-index: 9999;
        gap: 16px;
        transition: opacity 0.3s ease-out;
      "
    >
      <div
        style="
          width: 52px;
          height: 52px;
          border-radius: 14px;
          background: rgba(34, 197, 94, 0.08);
          border: 1px solid rgba(34, 197, 94, 0.4);
          display: flex;
          align-items: center;
          justify-content: center;

      >

          src="/favicon.svg"
          alt="Pola Mounir Logo"
          width="34"
          height="34"

        dev@pola:~$ <span style="color: #22c55e; font-weight: bold;">loading system...</span>
      </div>
      <div style="width: 140px; height: 3px; background: rgba(34, 197, 94, 0.15); border-radius: 999px; overflow: hidden; position: relative;">
        <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: #22c55e; border-radius: 999px; animation: init-bar 1.2s infinite ease-in-out;"></div>
      </div>
      <style>
        @keyframes init-bar {
          0% { left: -40%; width: 30%; }
          50% { left: 40%; width: 50%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
