# Netlify Configuration for Pola Mounir Portfolio

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://pola-portfolio-server.vercel.app/api/v1"

# Legacy route redirects matching vercel.json
[[redirects]]
  from = "/skills"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/experience"
  to = "/about"
  status = 301
  force = true

# SPA fallback rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache immutable Vite static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files freshness
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# PDF Resume header
[[headers]]
  for = "/Pola_Mounir_Resume.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline; filename=\"Pola_Mounir_Resume.pdf\""
    Cache-Control = "public, max-age=86400, must-revalidate"
